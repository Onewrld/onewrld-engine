# CI (continuous integration): GitHub runs every test automatically on each push to main
# and on each pull request. A red X on GitHub means something broke; a green check means
# all tests passed. It uses a throwaway Postgres database, never your real Supabase.

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: onewrld_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/onewrld_test

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the project
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]" flake8
    - name: Lint (stop on syntax errors or undefined names)
      run: flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Run all tests
      run: python -m pytest -q -rs
