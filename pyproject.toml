[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onewrld"
version = "0.1.0"
description = "ONEWRLD content, distribution, attribution and ads system"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "pillow>=10.0",
    "tzdata>=2024.1",  # time-zone database; Windows has none built in
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional: speech captions and dead-air cuts (Phase 3.2). Needs Python 3.11 to 3.14.
speech = ["faster-whisper>=1.1"]

[project.scripts]
onewrld = "onewrld.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets tests import small helpers such as spoken_clip.py
