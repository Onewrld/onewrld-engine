# Format library: repeatable video formats. The shot list generator builds shoot days from these.
# location: home | gym | outdoor | anywhere   talking: you speak to camera (uses speech captions)
# audio: voice | original (real sound) | none   seconds: finished length   film_minutes: time to film
# products: which item it shows (brand = no specific item)   drop_only: only for a new-drop tease
# Each shot: framing | what to film | duration

