# ONEWRLD brand bible: the machine-readable version of the brand.
# Every caption is scored against this file before it can be used.
# Edit freely; the scorer re-reads it every time.
# Format: TOML. Text goes in "double quotes"; lists go in [square brackets].

# A caption containing any of these is BLOCKED (score 0). Matching ignores case and
# only matches whole words. To ban a phrase, add a line (lowercase, in quotes, comma).
banned_phrases = [
  # talking down to people (L-005: "its rude")
  "isn't for you",
  "isnt for you",
  "not for you",
  "not made for the",
  "let's go",
  "lets go",
  "lfg",
  "drip",
  "fire 🔥",
  "🔥🔥",
  "insane",
  "crazy",
  "bussin",
  "no cap",
  "slay",
  "goat",
  "beast mode",
  "vibes",
  "sheesh",
  "built different",
  "grind season",
  "no days off",
  "rise and grind",
  "hustle harder",
  "don't miss out",
  "dont miss out",
  "limited time only",
  "act now",
  "hurry",
  "before it's too late",
  "selling like crazy",
  "last chance",
  "game changer",
  "game-changer",
  "elevate your",
  "unleash",
  "must-have",
  "next level",
  "level up",
  "take it to the next",
  "tag a friend",
  "smash that",
  "double tap",
  "you won't believe",
]

[brand]
name = "ONEWRLD"
home = "Staten Island, NY"
identity = "For the person who was never given a head start and never asked for one."
pillars = ["validation", "resilience", "arrival"]
positioning = ["dark", "premium", "serious", "distinct", "controlled", "aspirational"]

[voice]
do = [
  "Short sentences. Say it once.",
  "Plain words. Statements, not questions, by default.",
  "Controlled intensity. Confident, never loud.",
  "Real facts over adjectives (weight, wash, stock that is actually true).",
  "Sound like a person, not a brand account.",
]
dont = [
  "Talk down to people who are not the audience (L-005).",
  "Brag, including sold-out flexes (L-006).",
  "Abstract or poetic product lines; keep product copy physical (L-007).",
  "Hype-bro energy, gym-bro slang, internet slang.",
  "Fake urgency or invented scarcity.",
  "Emoji strings, exclamation strings, all-caps shouting.",
  "Corporate filler (\"elevate\", \"unleash\", \"game-changer\").",
]

[rules]
max_exclamation_marks = 1
max_emojis = 1
max_hashtags = 3
# Words allowed in ALL CAPS. Any other all-caps word of 3+ letters is penalized.
caps_allowed = ["ONEWRLD", "GSM", "XL", "XXL", "2XL", "NY", "USA", "DM"]
# Soft length limits in characters (over = small penalty, not a block).
soft_max_chars = 220
ideal_max_chars = 120

[[content_pillars]]
id = "story"
name = "Identity and story"
note = "Fall of Icarus myth, no head start, fly anyway."

[[content_pillars]]
id = "product"
name = "Product detail"
note = "480 GSM weight, wash, fit, how it is made."

[[content_pillars]]
id = "proof"
name = "Proof and scarcity (true facts only)"
note = "Sold-out history, stock that is really low, real customers."

[[content_pillars]]
id = "founder"
name = "Founder"
note = "One person, full-time job, building at night, Staten Island."

[[content_pillars]]
id = "gym"
name = "Training culture"
note = "Discipline, the work nobody sees. Gym as setting, not slogan."

# What each collection MEANS, in the owner's words. Story captions must fit this.
[collections.fall_of_icarus]
meaning = "Pride comes before the fall. Icarus got arrogant, ignored the warning, flew too high and fell. The collection is about staying disciplined and keeping your ego in check while you climb."
confirmed_by_owner = "2026-11-02"
avoid = [
  "Celebrating the fall or the attempt (\"fly anyway\", \"at least he flew\")",
  "Treating the sun as a goal to chase",
  "Heavy myth language: the owner prefers plain words",
]
