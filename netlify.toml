# Netlify: publishes the Affiliate Portal (the portal/ folder) as a static site. No build step.
[build]
  publish = "portal"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # Only run scripts that ship with the site; only talk to Supabase.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
